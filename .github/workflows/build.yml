# ===========================================================================
# GitHub Actions：云端构建 IndexTTS 2.5 镜像并推送到 GHCR
# ---------------------------------------------------------------------------
# 触发方式：
#   1. 把整个 index-tts-serverless 目录推送到 GitHub 仓库（默认分支）
#   2. 仓库 Settings -> Actions -> General：勾选 "Allow GitHub Actions to
#      create and approve pull requests"（写包权限）
#   3. 打开仓库 Actions 页，手动运行 "Build & Push IndexTTS 2.5"
# 产物：ghcr.io/<你的GitHub用户名>/indextts-2-5:latest（需设为 Public 供 RunPod 拉取）
# 说明：构建机为 GitHub 免费 Ubuntu 22.04，海外机房，拉权重/装依赖速度快。
# ===========================================================================
name: Build & Push IndexTTS 2.5

on:
  workflow_dispatch:      # 手动触发（网页 Actions 页点 Run workflow）
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/indextts-2-5:latest

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write          # 推送到 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 自动拥有 packages:write 权限，无需手动粘贴 ghp_ 令牌
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          # GitHub 海外机房直连 HuggingFace 速度快，无需镜像站；若超时可取消注释：
          # build-args: |
          #   HF_ENDPOINT=https://hf-mirror.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make image public (for RunPod pull)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/indextts-2-5/visibility" \
            -d '{"visibility":"public"}'
          echo "::notice::Image is now public: ${{ env.IMAGE_NAME }}"
