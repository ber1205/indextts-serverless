# ===========================================================================
# GitHub Actions：云端构建 IndexTTS 2.5 镜像并推送到 GHCR
# ---------------------------------------------------------------------------
# 官方最全功能：官方代码 index-tts/index-tts + 官方全量权重 IndexTeam/IndexTTS-2.5
# （含 qwen0.6bemo4-merge 情绪模型）+ 4 个辅助模型，全部烘焙进镜像。
# 产物：ghcr.io/ber1205/indextts-2-5:latest（自动设为 Public 供 RunPod 拉取）
# 触发：推送 main 或手动 Run workflow
# ===========================================================================
name: Build & Push IndexTTS 2.5

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/ber1205/indextts-2-5:latest

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write          # 推送到 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 自动拥有 packages:write，无需手动粘贴 ghp_ 令牌
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          provenance: false
          sbom: false
          # GitHub 海外机房直连 HuggingFace 速度快；若超时可改用镜像站：
          # build-args: |
          #   HF_ENDPOINT=https://hf-mirror.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make image public (for RunPod pull)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/indextts-2-5/visibility" \
            -d '{"visibility":"public"}'
          echo "::notice::Image is now public: ${{ env.IMAGE_NAME }}"
