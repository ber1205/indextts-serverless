# ===========================================================================
# GitHub Actions：云端构建 IndexTTS 2.5 镜像并推送到 GHCR
# ---------------------------------------------------------------------------
# 官方最全功能：官方代码 index-tts/index-tts + 官方全量权重 IndexTeam/IndexTTS-2.5
# （含 qwen0.6bemo4-merge 情绪模型）+ 4 个辅助模型，全部烘焙进镜像。
# 产物：ghcr.io/ber1205/indextts-2-5:latest（自动设为 Public 供 RunPod 拉取）
# 触发：推送 main 或手动 Run workflow
# ===========================================================================
name: Build & Push IndexTTS 2.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 只有核心运行文件变更才重建镜像；纯文档/脚本清理不触发，节省构建
    paths:
      - "Dockerfile"
      - "handler.py"

env:
  IMAGE_NAME: ghcr.io/ber1205/indextts-2-5:latest

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write          # 推送到 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub 免费 runner 磁盘仅 14GB，本次镜像含烘焙权重约 10GB+，
      # 先清理无用工具腾出空间，避免构建中途磁盘耗尽
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /opt/hostedtoolcache /usr/local/lib/node_modules
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 自动拥有 packages:write，无需手动粘贴 ghp_ 令牌
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          provenance: false
          sbom: false
          # GitHub 免费 runner 磁盘仅 14GB，关闭 GHA 层缓存避免磁盘叠加占用
          # 海外机房直连 HuggingFace 速度快；若超时可改用镜像站：
          # build-args: |
          #   HF_ENDPOINT=https://hf-mirror.com

      - name: Make image public (for RunPod pull)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/indextts-2-5/visibility" \
            -d '{"visibility":"public"}'
          echo "::notice::Image is now public: ${{ env.IMAGE_NAME }}"
