name: Probe Base Image
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build probe
        uses: docker/build-push-action@v6
        with:
          context: .
          file: probe.Dockerfile
          load: true
          tags: probe:test
      - name: Show disk usage
        run: df -h / | tail -1
